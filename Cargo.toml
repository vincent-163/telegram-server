[package]
name = "telegram-server"
version = "0.0.1"
edition = "2021"
description = "Standalone single-node Telegram server (MTProto + Bot API) written in Rust"
license = "MIT"

[dependencies]
grammers-tl-types = { version = "0.10", features = ["deserializable-functions", "tl-mtproto"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
num-integer = "0.1"
rsa = { version = "0.9", features = ["sha1"] }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
axum = { version = "0.7", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
hex = "0.4"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
time = { version = "0.3", features = ["formatting", "macros"] }
crc32fast = "1"
ctr = { version = "0.9", features = ["zeroize"] }
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 2
debug = false
